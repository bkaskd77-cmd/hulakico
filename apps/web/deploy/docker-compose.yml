# Hulakico on the shared VPS. Runs apart from other sites:
# own container, own port (127.0.0.1:3201), own memory and CPU limits.
# Run from this folder: docker compose up -d --build
name: hulakico

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - env
    image: hulakico-web:latest
    container_name: hulakico-web
    env_file: ../.env.production
    environment:
      BACKUP_DIR: /app/backups
      UPLOAD_DIR: /app/uploads
    # Nightly database backups (14 kept). A Docker volume: only root/Docker can read it,
    # and redeploys leave it alone.
    volumes:
      - backups:/app/backups
      # Customers' own invoice files (deleted 90 days after delivery).
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3201:3000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Python intelligence API. No published port: only the web container reaches it,
  # at http://intelligence:8000 on this project's private Docker network.
  intelligence:
    build:
      context: ../../../services/intelligence
      dockerfile: Dockerfile
    image: hulakico-intelligence:latest
    container_name: hulakico-intelligence
    env_file: ../../../services/intelligence/.env.production
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backups:
  uploads:

secrets:
  env:
    file: ../.env.production
