# Hulakico on the shared VPS. Runs apart from other sites:
# own container, own port (127.0.0.1:3201), own memory and CPU limits.
# Run from this folder: docker compose up -d --build
name: hulakico

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      secrets:
        - env
    image: hulakico-web:latest
    container_name: hulakico-web
    env_file: ../.env.production
    ports:
      - "127.0.0.1:3201:3000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  env:
    file: ../.env.production
