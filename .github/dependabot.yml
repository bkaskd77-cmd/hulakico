# Dependabot opens pull requests for outdated or vulnerable dependencies.
# CI must pass on each pull request before it is merged and deployed.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than 3 days, so a hijacked package version is
    # usually pulled before we take it. Security updates are not delayed.
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    # Majors held until the Next.js toolchain supports them (checked 24 Oct 2026):
    # eslint 10 breaks eslint-plugin-react/import/jsx-a11y peers, TypeScript 7
    # crashes typescript-eslint, and @types/node must match the Node 24 runtime.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /services/intelligence
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/intelligence
    schedule:
      interval: weekly
      day: monday
    # Stay on the Node 24 LTS line; move to Node 26 deliberately after it becomes
    # LTS (28 Oct 2026). Patch and minor base-image updates still arrive.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
